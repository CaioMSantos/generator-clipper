[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gta6-clipper"
version = "0.1.0"
description = "Pipeline de cortes automáticos (Twitch/Kick -> 9:16 legendado) para TikTok/Shorts"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.0",
    "anthropic>=1.0",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "faster_whisper.*"]
ignore_missing_imports = true
