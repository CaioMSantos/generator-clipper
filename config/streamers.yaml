# Streamers monitorados.
#
# layout.mode:
#   blur  -> vídeo inteiro centralizado sobre fundo desfocado (funciona pra qualquer layout; default seguro)
#   stack -> facecam em cima (30%) + gameplay embaixo (70%), padrão do canal; precisa calibrar o recorte.
#            Se o streamer muda a câmera de lugar, liste as outras posições em `facecam_alternates`:
#            por clip, vence a posição onde um rosto é detectado; sem rosto, o clip sai em blur.
#            O gameplay é cortado no centro; se a facecam estiver a menos de ~28% da borda,
#            defina `gameplay` começando depois dela para não vazar.
#
# Coordenadas de recorte são NORMALIZADAS (0..1) em relação ao vídeo original:
#   x, y = canto superior esquerdo; w, h = largura/altura.
# Para calibrar: `clipper frame <url-do-clip>` salva um PNG do clip; meça a facecam e preencha.

streamers:
  - name: Coringa
    platform: twitch
    login: coringa
    # Calibrado em 17/11/2026 (GTA RP): facecam no canto superior esquerdo.
    layout:
      mode: stack
      facecam: { x: 0.0, y: 0.0, w: 0.31, h: 0.31 }
      # Gameplay simétrico começando depois da cam, para ela não vazar na borda esquerda.
      gameplay: { x: 0.31, y: 0.0, w: 0.38, h: 1.0 }
      facecam_ratio: 0.30

  - name: Gaules
    platform: twitch
    login: gaules
    # Calibrado em 17/11/2026 num clip de CS: facecam à esquerda, no meio da altura.
    # Conferir com um clip de GTA (`clipper frame <url>`), o overlay pode mudar por jogo.
    layout:
      mode: stack
      facecam: { x: 0.0, y: 0.43, w: 0.20, h: 0.21 }
      facecam_ratio: 0.30
    # Se ele estiver transmitindo GTA na Kick, troque para:
    # platform: kick
    # login: gaules

  - name: Alanzoka
    platform: twitch
    login: alanzoka
    # Calibrado em 17/11/2026: facecam no canto superior esquerdo.
    layout:
      mode: stack
      facecam: { x: 0.005, y: 0.01, w: 0.215, h: 0.24 }
      facecam_ratio: 0.30

  - name: Davy Jones
    platform: twitch
    login: davyjones
    enabled: false  # transmite GTA VI pela Kick (0 clips na Twitch em 17/11)
    layout:
      mode: blur

  # ---- Kick ----------------------------------------------------------------
  # Clips da Kick têm ~10x menos views que os da Twitch: `min_views` por streamer
  # sobrescreve CLIPPER_MIN_VIEWS. Calibrar com o volume real do lançamento.

  - name: Davy Jones
    platform: kick
    login: davyjones
    min_views: 5
    # Calibrado em 18/11/2026 em GTA VI. Ele troca a câmera de canto conforme a cena;
    # a detecção de rosto escolhe a posição certa por clip. Cena de chat (câmera grande,
    # sem gameplay) não bate com nenhuma e cai no layout blur.
    layout:
      mode: stack
      facecam: { x: 0.015, y: 0.022, w: 0.215, h: 0.213 }       # canto superior esquerdo
      facecam_alternates:
        - { x: 0.784, y: 0.098, w: 0.213, h: 0.211 }            # canto superior direito
      facecam_ratio: 0.30

  - name: Coringa
    platform: kick
    login: coringa
    min_views: 5
    # Calibrado em 19/11/2026 em GTA VI: na Kick a câmera fica à esquerda, no meio da
    # altura, e sobe/desce um pouco conforme a cena. A detecção escolhe a que enquadra o rosto.
    layout:
      mode: stack
      facecam: { x: 0.0, y: 0.405, w: 0.25, h: 0.28 }           # missões / cutscenes
      facecam_alternates:
        - { x: 0.0, y: 0.455, w: 0.25, h: 0.28 }                 # mundo aberto / dirigindo
        - { x: 0.0, y: 0.372, w: 0.25, h: 0.25 }                 # cena "contas ativas"
      facecam_ratio: 0.30

  - name: Gaules
    platform: kick
    login: gaules
    min_views: 5
    # Em 18/11 estava em IRL (Miami); layout de GTA na Kick ainda não visto.
    layout:
      mode: blur

